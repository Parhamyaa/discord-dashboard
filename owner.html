<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PahoyaaSecurity – Owner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        .header {
            padding: 25px 35px;
            background: #111936;
            border-bottom: 1px solid #26345f;
        }

        .header h1 {
            margin: 0;
            color: #4da3ff;
        }

        .header p {
            margin: 8px 0 0;
            color: #9aa8c7;
        }

        .container {
            padding: 35px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111936;
            border: 1px solid #26345f;
            border-radius: 15px;
            padding: 25px;
        }

        .card h2 {
            margin-top: 0;
            color: #4da3ff;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }

        #loading {
            text-align: center;
            margin-top: 100px;
            color: #9aa8c7;
        }

        #denied {
            display: none;
            text-align: center;
            margin-top: 100px;
        }

        #denied h1 {
            color: #f87171;
        }

        #owner-content {
            display: none;
        }
    </style>
</head>

<body>

    <div id="loading">
        <h2>🔐 Owner-Berechtigung wird geprüft...</h2>
    </div>

    <div id="denied">
        <h1>⛔ Zugriff verweigert</h1>
        <p>Du hast keine Berechtigung für den Owner-Bereich.</p>
        <a href="/" style="color:#4da3ff;">← Zurück zum Dashboard</a>
    </div>

    <div id="owner-content">

        <div class="header">
            <h1>👑 PahoyaaSecurity Owner</h1>
            <p>Owner-Bereich</p>
        </div>

        <div class="container">

            <div class="grid">

                <div class="card">
                    <h2>🤖 Bot Status</h2>
                    <div class="value status">ONLINE</div>
                </div>

                <div class="card">
                    <h2>🌐 Server</h2>
                    <div class="value">6</div>
                </div>

                <div class="card">
                    <h2>🛡️ Security</h2>
                    <div class="value status">AKTIV</div>
                </div>

                <div class="card">
                    <h2>⚡ Bot</h2>
                    <div class="value">PahoyaaSecurity</div>
                </div>

            </div>

        </div>

    </div>

    <script>
        fetch("/api/owner")
            .then(response => response.json())
            .then(data => {

                document.getElementById("loading").style.display = "none";

                if (data.allowed === true) {
                    document.getElementById("owner-content").style.display = "block";
                } else {
                    document.getElementById("denied").style.display = "block";
                }

            })
            .catch(() => {

                document.getElementById("loading").style.display = "none";
                document.getElementById("denied").style.display = "block";

            });
    </script>

</body>
</html>
