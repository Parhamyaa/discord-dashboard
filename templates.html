<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PahoyaaSecurity - Templates</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1120;
color:white;
}


.navbar{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
background:#111827;
border-bottom:1px solid #1e3a8a;
}


.logo{
font-size:22px;
font-weight:bold;
}


.back{
background:#2563eb;
color:white;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
}


.container{
max-width:900px;
margin:50px auto;
padding:20px;
}


.box{

background:#111827;
border:1px solid #1e3a8a;
border-radius:12px;
padding:25px;

}


h1{
font-size:36px;
}


label{

display:block;
margin-top:20px;
margin-bottom:8px;
color:#9ca3af;

}


input,select{

width:100%;
padding:12px;
background:#0b1120;
color:white;
border:1px solid #374151;
border-radius:8px;

}


.status{

color:#6ee7b7;
font-weight:bold;

}


button{

margin-top:25px;
background:#2563eb;
color:white;
border:none;
padding:14px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:#1d4ed8;

}

</style>

</head>


<body>


<nav class="navbar">

<div class="logo">
📋 Template Einstellungen
</div>


<a class="back" href="index.html">
⬅ Zurück
</a>


</nav>



<div class="container">


<h1>
📋 Server Template
</h1>


<div class="box">


<h2>
Server Aufbau
</h2>


<p>
Status:
<span class="status">
BEREIT
</span>
</p>



<label>
Template auswählen
</label>


<select>

<option>
Gaming Server
</option>

<option>
Roleplay Server
</option>

<option>
Community Server
</option>

<option>
Support Server
</option>

</select>




<label>
Anzahl Rollen
</label>


<input type="number" value="10" min="1" max="100">





<label>
Anzahl Kanäle
</label>


<input type="number" value="20" min="1" max="200">





<label>
Anzahl Kategorien
</label>


<input type="number" value="5" min="1" max="50">





<label>
Standard Rollen erstellen
</label>


<select>

<option>
Ja
</option>

<option>
Nein
</option>

</select>




<label>
Standard Kanäle erstellen
</label>


<select>

<option>
Ja
</option>

<option>
Nein
</option>

</select>



<button>
💾 Template speichern
</button>


</div>


</div>


</body>

</html>
